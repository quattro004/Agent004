packages:
  - 'packages/*'
allowBuilds:
  # Optional native file watcher pulled in by jest-haste-map (jest 30.5+).
  # Tests always run single-shot, never in watch mode, so jest falls back
  # cleanly and we avoid a node-gyp compile. Denied explicitly so installs
  # don't fail with ERR_PNPM_IGNORED_BUILDS.
  '@parcel/watcher': false
  better-sqlite3: false
  esbuild: true
  node-llama-cpp: false
  tree-sitter-go: false
  tree-sitter-javascript: false
  tree-sitter-python: false
  tree-sitter-rust: false
  tree-sitter-typescript: false
  unrs-resolver: true
# pnpm reads overrides only from this file. A top-level `overrides` key in
# package.json is npm-only, and pnpm 11 also ignores `pnpm.overrides` there.
#
# Keep this list to overrides that are doing work. An override for a transitive
# advisory is a one-time *nudge*, not a permanent fix: pnpm will not re-resolve
# a dependency the lockfile already satisfies, so an override is often the only
# way to move one — but once the lockfile carries the patched version, the
# override is inert and can go. Five of them (fast-uri, qs, hono, js-yaml,
# ip-address) were removed on 2026-09-28 after verifying that removing them
# changed no resolved version and left `pnpm audit` clean.
#
# Leaving inert overrides behind is not free. Each is a floor someone must
# revisit by hand, it hides whether the upstream graph actually recovered, and
# it can hold a dependency *back* once the range moves on. The standing
# protection is the Audit job, which runs `pnpm audit` on every PR against the
# live advisory database — so a regression is caught in review rather than
# silently pre-empted by a pin nobody re-reads.
#
# Forces a single Zod 4 version across the graph per research.md §R1. The floor
# must stay at or above the `zod` version declared by packages/agent so the
# override can never resolve below the package's own declared dependency.
overrides:
  zod: ^4.6.1
