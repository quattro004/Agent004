packages:
  - 'packages/*'
allowBuilds:
  # Optional native file watcher pulled in by jest-haste-map (jest 30.5+).
  # Tests always run single-shot, never in watch mode, so jest falls back
  # cleanly and we avoid a node-gyp compile. Denied explicitly so installs
  # don't fail with ERR_PNPM_IGNORED_BUILDS.
  '@parcel/watcher': false
  better-sqlite3: false
  esbuild: true
  node-llama-cpp: false
  tree-sitter-go: false
  tree-sitter-javascript: false
  tree-sitter-python: false
  tree-sitter-rust: false
  tree-sitter-typescript: false
  unrs-resolver: true
# pnpm reads overrides only from this file. A top-level `overrides` key in
# package.json is npm-only, and pnpm 11 also ignores `pnpm.overrides` there.
# Forces a single Zod 4 version across the graph per research.md §R1. The floor
# tracks the `zod` version declared by packages/agent so the override can never
# resolve below the package's own declared dependency.
overrides:
  zod: ^4.5.2
  # Transitive-only, both reached via @strands-agents/sdk. Neither is a direct
  # dependency, so the advisories can only be cleared by an override until the
  # SDK bumps its own graph.
  # GHSA-f65p-4m7j-42xc, GHSA-fph4-wmhf-6fwf, GHSA-jqff-g426-hqxp (high):
  # host confusion and SSRF via percent-decoding. Patched in 3.1.6.
  fast-uri: ^3.1.6
  # GHSA-x5fp-wj9c-mxmx, GHSA-4mjr-xmp4-gh2g (moderate): array-limit bypass and
  # DoS via attacker-controlled isBuffer. Patched in 6.16.0.
  qs: ^6.16.0
